name: check examples

on:
  push:
  pull_request:

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang libsqlite3-dev
      - name: Pin from the matching branch (docs `next` describes Pin's `next`; anything else the release)
        uses: actions/checkout@v4
        with:
          repository: pin-language/pin
          ref: ${{ github.ref_name == 'next' && 'next' || '' }}
          path: _pin
      - name: Every example compiles, runs and prints what the page says
        run: PIN="$PWD/_pin/pin" python3 tools/check_examples.py learn/*.md ai-guide.md language.md
